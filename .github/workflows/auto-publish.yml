name: Auto-publish scheduled articles

on:
  schedule:
    # Every day at 7:00 UTC (9:00 Paris time)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (show what would be published without saving)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run auto-publish script
        run: php scripts/auto-publish.php

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/articles.json data/publish-schedule.json sitemap.xml || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Cap Vietnam Bot"
          git config user.email "bot@blog-capvietnam.fr"
          git add data/articles.json data/publish-schedule.json sitemap.xml
          git commit -m "Auto-publish: $(date +%Y-%m-%d)"
          git push

      # Un push fait avec le GITHUB_TOKEN par défaut ne redéclenche pas
      # automatiquement le workflow "Deploy to OVH FTP" (limitation GitHub Actions).
      # On déploie donc ici directement, dans la même exécution, pour que la
      # publication soit réellement mise en ligne sans intervention manuelle.
      - name: Deploy via FTP
        if: steps.changes.outputs.changed == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /www4/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .claude/**
            logs/**
            AUDIT*.md
            CHANGELOG*.md
            IMAGES_TODO.md
